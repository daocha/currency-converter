services:
  currency-converter:
    build: .
    image: currency-converter:latest
    container_name: currency-converter
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Cache lifetime in seconds (300 = 5 min, 900 = 15 min).
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-300}"
      # Preferred live-rate provider; missing currencies use the other providers.
      FX_SOURCE: "${FX_SOURCE:-yahoo}"
      # Optional: how many seconds before expiry to refresh (default: 20% of TTL, max 60s).
      # REFRESH_MARGIN_SECONDS: "60"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Only needed if your reverse proxy forwards /fx/... without stripping the prefix.
      BASE_PATH: "${BASE_PATH:-}"
    volumes:
      # Chart history lives here; without it the chart re-backfills (up to 1 year of daily data) after a rebuild.
      - fx-data:/data
    restart: unless-stopped

volumes:
  fx-data:
