<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Currency Converter</title>
  <meta name="description" content="Fast currency converter with near real-time FX rates.">
  <meta name="theme-color" content="#f6f7fb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply the saved theme before first paint to avoid a flash, and hide the content until
    // app.js has rendered the currency list (with a safety timeout in case it fails to load).
    (function () {
      document.documentElement.classList.add("booting");
      setTimeout(function () { document.documentElement.classList.remove("booting"); }, 3000);
      try {
        var t = JSON.parse(localStorage.getItem("cc.prefs") || "{}").theme || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-icon">↻</span></div>
  <header class="topbar">
    <h1 data-i18n="title">Currency Converter</h1>
    <div class="actions">
      <button id="install-btn" class="btn ghost" data-i18n="install" hidden>Install</button>
      <label class="icon-select lang-picker">
        <span class="select-icon" aria-hidden="true">🌐</span>
        <span class="sr-only" data-i18n="language">Language</span>
        <select id="lang-select" aria-label="Language" data-i18n-attrs="aria-label:language">
          <option value="system" data-i18n="system">System</option>
          <option value="en">English</option>
          <option value="zh-TW">繁體中文</option>
        </select>
      </label>
      <label class="icon-select theme-picker">
        <span id="theme-icon" class="select-icon" aria-hidden="true">◐</span>
        <span class="sr-only" data-i18n="theme">Theme</span>
        <select id="theme-select" aria-label="Theme" data-i18n-attrs="aria-label:theme">
          <option value="system" data-i18n="system">System</option>
          <option value="light" data-i18n="light">Light</option>
          <option value="dark" data-i18n="dark">Dark</option>
        </select>
      </label>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="status-wrap">
        <span id="status" class="status" aria-live="polite" data-i18n="loadingRates">Loading rates…</span>
        <button id="refresh-btn" class="icon-btn refresh" title="Refresh rates" aria-label="Refresh rates" data-i18n-attrs="title:refreshRates,aria-label:refreshRates">↻</button>
      </div>
      <button id="edit-btn" class="btn ghost" aria-pressed="false" data-i18n="edit">Edit</button>
    </div>

    <ul id="currency-list" class="currency-list"></ul>

    <button id="add-btn" class="btn primary block" data-i18n="addCurrency">+ Add currency</button>
  </main>

  <footer class="footer">
    <span id="source"></span>
  </footer>

  <dialog id="picker">
    <form method="dialog" class="picker">
      <div class="picker-head">
        <input id="picker-search" type="search" placeholder="Search currencies" autocomplete="off" aria-label="Search currencies" data-i18n-attrs="placeholder:searchCurrencies,aria-label:searchCurrencies">
        <button class="btn ghost" value="close" data-i18n="done">Done</button>
      </div>
      <ul id="picker-list" class="picker-list"></ul>
    </form>
  </dialog>

  <dialog id="chart">
    <form method="dialog" class="chart">
      <div class="chart-head">
        <div class="chart-titles">
          <div id="chart-title" class="chart-title"></div>
          <div id="chart-change" class="chart-change"></div>
        </div>
        <button class="btn ghost" value="close" data-i18n="done">Done</button>
      </div>
      <div id="chart-readout" class="chart-readout" aria-live="polite"></div>
      <div id="chart-plot" class="chart-plot">
        <svg id="chart-svg" class="chart-svg" role="img"></svg>
        <div id="chart-msg" class="chart-msg"></div>
      </div>
      <div class="chart-ranges" role="group" data-i18n-attrs="aria-label:chartRange" aria-label="Time range">
        <button type="button" class="btn ghost" data-range="1d" data-i18n="range1d">1D</button>
        <button type="button" class="btn ghost" data-range="1w" data-i18n="range1w">1W</button>
        <button type="button" class="btn ghost" data-range="1m" data-i18n="range1m">1M</button>
        <button type="button" class="btn ghost" data-range="3m" data-i18n="range3m">3M</button>
        <button type="button" class="btn ghost" data-range="1y" data-i18n="range1y">1Y</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="keypad" class="keypad" hidden>
    <div class="keypad-inner" role="group" aria-label="Calculator keypad" data-i18n-attrs="aria-label:keypad">
      <div class="keypad-head">
        <span id="keypad-target" class="keypad-target"></span>
        <span id="keypad-preview" class="keypad-preview" aria-live="polite"></span>
        <button type="button" class="keypad-done" data-action="done" data-i18n="done">Done</button>
      </div>
      <div class="keypad-grid">
        <button type="button" class="fn" data-action="clear" aria-label="Clear" data-i18n-attrs="aria-label:clear">C</button>
        <button type="button" class="fn" data-insert="(" aria-label="Open parenthesis" data-i18n-attrs="aria-label:openParen">(</button>
        <button type="button" class="fn" data-insert=")" aria-label="Close parenthesis" data-i18n-attrs="aria-label:closeParen">)</button>
        <button type="button" class="op" data-insert="÷" aria-label="Divide" data-i18n-attrs="aria-label:divide">÷</button>
        <button type="button" data-insert="7">7</button>
        <button type="button" data-insert="8">8</button>
        <button type="button" data-insert="9">9</button>
        <button type="button" class="op" data-insert="×" aria-label="Times" data-i18n-attrs="aria-label:times">×</button>
        <button type="button" data-insert="4">4</button>
        <button type="button" data-insert="5">5</button>
        <button type="button" data-insert="6">6</button>
        <button type="button" class="op" data-insert="−" aria-label="Minus" data-i18n-attrs="aria-label:minus">−</button>
        <button type="button" data-insert="1">1</button>
        <button type="button" data-insert="2">2</button>
        <button type="button" data-insert="3">3</button>
        <button type="button" class="op" data-insert="+" aria-label="Plus" data-i18n-attrs="aria-label:plus">+</button>
        <button type="button" data-insert="0">0</button>
        <button type="button" data-insert="." aria-label="Decimal point" data-i18n-attrs="aria-label:decimal">.</button>
        <button type="button" class="fn" data-action="backspace" aria-label="Backspace" data-i18n-attrs="aria-label:backspace">⌫</button>
        <button type="button" class="equals" data-action="equals" aria-label="Equals" data-i18n-attrs="aria-label:equals">=</button>
      </div>
    </div>
  </div>

  <template id="row-template">
    <li class="row">
      <span class="flag" aria-hidden="true"></span>
      <div class="meta">
        <span class="code"></span>
        <span class="name"></span>
      </div>
      <div class="value">
        <input class="amount" type="text" inputmode="none" autocomplete="off" spellcheck="false">
        <span class="hint"></span>
      </div>
      <div class="edit-controls">
        <button class="icon-btn handle" title="Drag to reorder" aria-label="Drag to reorder" data-i18n-attrs="title:dragHandle,aria-label:dragHandle">☰</button>
        <button class="icon-btn remove" title="Remove" aria-label="Remove" data-i18n-attrs="title:remove,aria-label:remove">✕</button>
      </div>
    </li>
  </template>

  <script src="calc.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
